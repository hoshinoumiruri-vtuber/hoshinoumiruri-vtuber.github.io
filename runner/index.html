<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>琉璃跑跑</title>
<meta name="description" content="星ノ海琉璃的像素小遊戲：跳過蝸牛和芭樂騎士，閃開毛豆和星星。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231b2152%27/%3E%3Cpath d=%27M32 8l5 19 19 5-19 5-5 19-5-19-19-5 19-5z%27 fill=%27%23c2adff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=runner">
<style>
  /* no grey flash where the finger lands (the browsers of phones paint one over anything that takes a tap) */
  html, body, #runner, #runner * { -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: none; overscroll-behavior: none; }
  /* Nothing on this page can be selected or long-pressed into a menu (look up, copy, share): a finger that rests on the screen
     for a moment in the middle of a game must not open one. -webkit-touch-callout is not inherited, so it is set on every element. */
  html, body, body * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  main#runner { max-width: 820px; margin: 0 auto; padding: 18px 16px 60px; text-align: center; }
  #runner h1 { font-size: 1.5rem; margin: 6px 0 14px; }
  #cv { width: 100%; max-width: 760px; height: auto; aspect-ratio: 640 / 220; display: block; margin: 0 auto; image-rendering: pixelated; touch-action: none; border-radius: 12px; background: rgba(20, 24, 70, .35); outline: 0; user-select: none; -webkit-user-select: none; }
  #msg { margin: 14px 0 4px; min-height: 1.6em; font-weight: 600; }
  #runner .sub { margin: 4px 0; }
  #runner a.back { display: inline-block; margin-top: 18px; color: var(--acc); }
  /* the card of the badge */
  #badge { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(8, 10, 36, .78); animation: bfade .35s ease both; }
  #badge .card { position: relative; width: min(340px, 100%); padding: 26px 22px 22px; border-radius: 18px; text-align: center; overflow: hidden;
    background: linear-gradient(170deg, #2a2f78, #1b1f52 60%, #2a1f5e); border: 1px solid #5a63c0; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); animation: bpop .55s cubic-bezier(.2, 1.5, .4, 1) both; }
  #badge img { position: relative; display: block; margin: 6px auto 10px; border-radius: 50%; image-rendering: pixelated; box-shadow: 0 0 0 3px #c2adff, 0 0 26px rgba(190, 170, 255, .8); animation: bfloat 2.6s ease-in-out infinite; }
  #badge .rays { position: absolute; left: 50%; top: 112px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; opacity: .35;
    background: repeating-conic-gradient(rgba(194, 173, 255, .55) 0 8deg, transparent 8deg 24deg); animation: bspin 14s linear infinite; }
  #badge h2 { position: relative; margin: 8px 0 6px; font-size: 1.25rem; color: #fff; }
  #badge p { position: relative; margin: 0 0 16px; color: #d6d9ff; }
  #badge .go { position: relative; display: inline-block; padding: 9px 22px; border-radius: 999px; background: #c2adff; color: #170f38; font-weight: 700; }
  #badge .x { position: absolute; top: 8px; right: 10px; z-index: 2; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; font-size: 1rem; }
  /* the rainbow one: warm rays in every colour, a golden ring */
  #badge.rainbow .rays { opacity: .5; background: repeating-conic-gradient(#ff8f8f 0 6deg, transparent 6deg 15deg, #ffd76a 15deg 21deg, transparent 21deg 30deg, #8fe89a 30deg 36deg, transparent 36deg 45deg, #8fc4ff 45deg 51deg, transparent 51deg 60deg, #c9a0ff 60deg 66deg, transparent 66deg 75deg); animation-duration: 9s; }
  #badge.rainbow img { box-shadow: 0 0 0 3px #ffe08a, 0 0 30px rgba(255, 224, 138, .9); }
  #badge.rainbow .go { background: #ffe08a; }
  @keyframes bfade { from { opacity: 0; } }
  @keyframes bpop { from { transform: scale(.4); opacity: 0; } }
  @keyframes bfloat { 50% { transform: translateY(-7px); } }
  @keyframes bspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #badge .rays, #badge img { animation: none; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><i></i><i></i><i></i><b></b><b></b><b></b></div>
<main id="runner">
  <h1 id="ttl">琉璃跑跑</h1>
  <canvas id="cv" width="640" height="220" aria-label="game"></canvas>
  <p id="msg"></p>
  <p class="sub" id="how"></p>
  <a class="back" id="back" href="/">← 回到直播資料庫</a>
</main>
<script src="/runner/sprites.js?v=23"></script>
<script src="/runner/game.js?v=23"></script>
</body>
</html>
